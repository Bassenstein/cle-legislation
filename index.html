  </div>
  <div class="cmeta">
    The FixOurStreets216 Project &nbsp;·&nbsp; Cleveland, Ohio<br>
    Neighborhoods First &nbsp;·&nbsp; #WeThePeople<br>
    fixourstreets216.com &nbsp;·&nbsp; ${PROJECT} &nbsp;·&nbsp; ${DATE}
  </div>`}
];

/* ============ RENDER ============ */
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.cover?' cover':'') + (s.closer?' closer':'');
  let head = '';
  if(!s.cover && !s.closer){
    head = `<div class="shead">
      <img class="mark" src="${LOGO}" alt="FOS216">
      <div class="txt">
        <div class="kicker">${s.kicker||''}</div>
        <h1 class="stitle">${s.title}</h1>
        ${s.sub?`<div class="sub">${s.sub}</div>`:''}
      </div>
    </div>`;
  }
  const tb = `<div class="tblock">
    <div class="tb keep"><span class="lbl">Project</span><span class="val o">${PROJECT}</span></div>
    <div class="tb"><span class="lbl">Client</span><span class="val">Public Record</span></div>
    <div class="tb"><span class="lbl">Scale</span><span class="val">N.T.S.</span></div>
    <div class="tb"><span class="lbl">Date</span><span class="val">${DATE}</span></div>
    <div class="tb"><span class="lbl">Rev</span><span class="val">${REV}</span></div>
    <div class="tb grow"><span class="lbl">Sheet Title</span><span class="val t">${s.part}</span></div>
    <div class="tb keep" style="border-right:none"><span class="lbl">Sheet</span><span class="val o">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>
  </div>`;
  el.innerHTML = head + `<div class="body">${s.html}</div>` + tb;
  deck.appendChild(el);
});

/* ============ NAV ============ */
let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
function go(n){
  cur = Math.max(0, Math.min(S.length-1, n));
  slides.forEach((el,i)=>el.classList.toggle('on', i===cur));
  document.getElementById('bar').style.width = ((cur+1)/S.length*100)+'%';
  const b = slides[cur].querySelector('.body'); if(b) b.scrollTop = 0;
  try{ location.hash = 's'+(cur+1); }catch(e){}
}
document.getElementById('bNext').onclick = ()=>go(cur+1);
document.getElementById('bPrev').onclick = ()=>go(cur-1);
document.getElementById('bIdx').onclick = ()=>document.getElementById('idx').classList.toggle('on');
document.getElementById('bFs').onclick = ()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen&&document.exitFullscreen(); }
};

const ig = document.getElementById('igrid');
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'icell';
  const t = (s.title||'').replace(/<[^>]+>/g,'');
  d.innerHTML = `<div class="n">${String(i+1).padStart(2,'0')} &nbsp;·&nbsp; ${s.part}</div><div class="t">${t}</div>`;
  d.onclick = ()=>{ go(i); document.getElementById('idx').classList.remove('on'); };
  ig.appendChild(d);
});

document.addEventListener('keydown', e=>{
  const idx = document.getElementById('idx');
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); }
  else if(e.key==='End'){ go(S.length-1); }
  else if(e.key.toLowerCase()==='i'){ idx.classList.toggle('on'); }
  else if(e.key.toLowerCase()==='f'){ document.getElementById('bFs').click(); }
  else if(e.key.toLowerCase()==='p'){ e.preventDefault(); window.print(); }
  else if(e.key==='Escape'){ idx.classList.remove('on'); }
});

let tsX=null, tsY=null;
document.addEventListener('touchstart', e=>{ tsX=e.changedTouches[0].clientX; tsY=e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(tsX===null) return;
  const dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
  if(Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy)*1.6){ go(cur + (dx<0?1:-1)); }
  tsX=null;
}, {passive:true});

const m = (location.hash||'').match(/^#s(\d+)$/);
go(m ? parseInt(m[1],10)-1 : 0);
</script>
</body>
</html>
