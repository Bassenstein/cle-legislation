<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency by Default &mdash; Cleveland City Council Emergency Ordinances | The FixOurStreets216 Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#243038; --steel-2:#1b242b; --steel-3:#141b21; --steel-4:#0d1317;
  --orange:#E1560F; --orange-br:#FF6A1A;
  --teal:#0E8E84; --teal-br:#19C3B2;
  --paper:#F4F1EC; --paper-2:#DCD6CC;
  --ink:#0B1014;
  --line:rgba(244,241,236,.14);
  --line-2:rgba(244,241,236,.28);
  --sans:'Archivo','Archivo Narrow','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--steel-4); color:var(--paper);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- DECK SHELL ---------- */
#deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute; inset:0;
  display:none; flex-direction:column;
  padding:clamp(20px,3.2vh,44px) clamp(20px,4vw,72px) 74px;
  background:
    radial-gradient(1200px 620px at 80% -12%, rgba(14,142,132,.20), transparent 62%),
    radial-gradient(900px 520px at 4% 108%, rgba(225,86,15,.17), transparent 60%),
    linear-gradient(168deg,var(--steel) 0%, var(--steel-2) 48%, var(--steel-4) 100%);
  overflow:hidden;
}
.slide.on{display:flex;animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.30;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px; mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 72%);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 72%);
}
.body{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
  display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(11px,1.7vh,20px)}
.body > *{flex-shrink:0}
.body > *[style*="margin-top"]{margin-top:0!important}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* ---------- HEADER ---------- */
.shead{position:relative;z-index:3;display:flex;align-items:flex-start;gap:18px;
  border-bottom:2px solid var(--orange); padding-bottom:12px; margin-bottom:clamp(14px,2.4vh,26px); flex-shrink:0}
.shead .mark{width:clamp(40px,4.4vh,60px);height:clamp(40px,4.4vh,60px);flex-shrink:0;
  filter:drop-shadow(0 0 7px rgba(255,255,255,.95)) drop-shadow(0 0 18px rgba(255,255,255,.45))}
.shead .txt{flex:1;min-width:0}
.kicker{font-family:var(--mono);font-size:clamp(9px,1.05vh,11.5px);letter-spacing:.20em;text-transform:uppercase;color:var(--teal-br);margin-bottom:5px;font-weight:500}
.kicker .part{color:var(--orange-br)}
h1.stitle{font-size:clamp(21px,3.8vh,44px);line-height:1.06;font-weight:800;letter-spacing:-.018em;text-wrap:balance}
h1.stitle em{font-style:normal;color:var(--orange-br)}
.sub{margin-top:8px;font-size:clamp(13px,1.78vh,18px);line-height:1.45;color:var(--paper-2);max-width:96ch;font-weight:400}

/* ---------- TITLE BLOCK FOOTER (FOS216 drawing-set convention) ---------- */
.tblock{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:stretch;
  border-top:1px solid var(--line-2);background:rgba(9,14,17,.90);backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;height:46px}
.tb{padding:7px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;white-space:nowrap}
.tb .lbl{color:rgba(244,241,236,.42);font-size:8.5px;letter-spacing:.17em}
.tb .val{color:var(--paper);font-weight:500;font-size:10.5px;letter-spacing:.055em}
.tb.grow{flex:1;overflow:hidden;border-right:none}
.tb.grow .val{text-overflow:ellipsis;overflow:hidden}
.tb .val.o{color:var(--orange-br)}
.tb .val.t{color:var(--teal-br)}

/* ---------- NAV ---------- */
#nav{position:fixed;right:14px;bottom:56px;z-index:20;display:flex;gap:7px;align-items:center}
.nbtn{width:34px;height:34px;border:1px solid var(--line-2);background:rgba(20,27,33,.88);color:var(--paper);
  border-radius:5px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.16s;font-family:var(--mono)}
.nbtn:hover{background:var(--orange);border-color:var(--orange);transform:translateY(-1px)}
#bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--orange-br),var(--teal-br));z-index:30;transition:width .28s ease;width:0}

/* ---------- INDEX OVERLAY ---------- */
#idx{position:fixed;inset:0;z-index:60;background:rgba(8,12,15,.975);display:none;padding:34px clamp(20px,5vw,70px);overflow-y:auto}
#idx.on{display:block}
#idx h2{font-size:19px;letter-spacing:.2em;font-family:var(--mono);color:var(--teal-br);text-transform:uppercase;margin-bottom:20px;font-weight:500}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.icell{border:1px solid var(--line);border-left:3px solid var(--orange);padding:9px 13px;cursor:pointer;transition:.14s;background:rgba(255,255,255,.02);border-radius:0 4px 4px 0}
.icell:hover{background:rgba(225,86,15,.17);border-left-color:var(--teal-br);transform:translateX(3px)}
.icell .n{font-family:var(--mono);font-size:9.5px;color:var(--teal-br);letter-spacing:.16em}
.icell .t{font-size:13.5px;margin-top:3px;font-weight:600;line-height:1.3}

/* ---------- CONTENT PRIMITIVES ---------- */
.grid{display:grid;gap:clamp(11px,1.7vh,20px)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:1.35fr 1fr}
.g12{grid-template-columns:1fr 1.5fr}

.card{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--line);border-radius:7px;padding:clamp(14px,2.2vh,24px);position:relative;overflow:hidden}
.card.o{border-left:4px solid var(--orange)}
.card.t{border-left:4px solid var(--teal-br)}
.card.warn{border-left:4px solid var(--orange);background:linear-gradient(160deg,rgba(225,86,15,.15),rgba(225,86,15,.04))}
.card.good{border-left:4px solid var(--teal-br);background:linear-gradient(160deg,rgba(25,195,178,.14),rgba(25,195,178,.035))}
.card h3{font-size:clamp(14px,1.95vh,19px);font-weight:700;margin-bottom:7px;letter-spacing:-.01em;line-height:1.2}
.card h3 .num{font-family:var(--mono);color:var(--orange-br);font-size:.82em;margin-right:7px;font-weight:700}
.card p{font-size:clamp(12px,1.72vh,16px);line-height:1.55;color:var(--paper-2)}
.card p + p{margin-top:7px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--teal-br);margin-bottom:7px;font-weight:500}
.eyebrow.o{color:var(--orange-br)}

ul.bul{list-style:none;font-size:clamp(12px,1.72vh,16px);line-height:1.55;color:var(--paper-2)}
ul.bul li{position:relative;padding-left:19px;margin-bottom:8px}
ul.bul li::before{content:"";position:absolute;left:0;top:.52em;width:7px;height:7px;background:var(--orange);transform:rotate(45deg)}
ul.bul.t li::before{background:var(--teal-br)}
ul.bul li strong{color:var(--paper);font-weight:700}
ol.num{list-style:none;counter-reset:s;font-size:clamp(12px,1.72vh,16px);line-height:1.55;color:var(--paper-2)}
ol.num li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:11px}
ol.num li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-1px;font-family:var(--mono);font-size:12px;color:var(--orange-br);font-weight:700;
  border:1px solid var(--line-2);border-radius:3px;padding:1px 5px;line-height:1.25}
ol.num li strong{color:var(--paper);font-weight:700;display:block;margin-bottom:2px}

.stat{text-align:center;padding:clamp(12px,2vh,22px) 10px;border:1px solid var(--line);border-radius:7px;
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.stat .big{font-family:var(--sans);font-size:clamp(30px,6.4vh,68px);font-weight:900;line-height:.92;letter-spacing:-.035em;
  background:linear-gradient(160deg,var(--orange-br),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.tl .big{background:linear-gradient(160deg,var(--teal-br),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .lab{font-family:var(--mono);font-size:clamp(9px,1.22vh,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-2);margin-top:9px;line-height:1.42}

table.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.6vh,15px)}
table.tbl th{background:rgba(225,86,15,.20);text-align:left;padding:9px 11px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;border-bottom:2px solid var(--orange);color:var(--paper);font-weight:500;vertical-align:bottom}
table.tbl th.t{background:rgba(25,195,178,.18);border-bottom-color:var(--teal-br)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--paper-2);line-height:1.4;vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl.tight td{padding:6px 12px}
table.tbl.tight th{padding:7px 12px}
table.tbl tbody tr:nth-child(even){background:rgba(255,255,255,.028)}
table.tbl td.k{color:var(--paper);font-weight:600}
.yes{color:var(--teal-br);font-weight:700}
.no{color:var(--orange-br);font-weight:700}

blockquote.q{border-left:4px solid var(--teal-br);padding:14px 0 14px 19px;font-size:clamp(13px,1.95vh,19px);
  line-height:1.5;font-style:italic;color:var(--paper);background:linear-gradient(90deg,rgba(25,195,178,.09),transparent)}
blockquote.q cite{display:block;margin-top:9px;font-style:normal;font-family:var(--mono);font-size:10px;
  letter-spacing:.11em;color:var(--teal-br);text-transform:uppercase}
blockquote.q.o{border-left-color:var(--orange);background:linear-gradient(90deg,rgba(225,86,15,.11),transparent)}
blockquote.q.o cite{color:var(--orange-br)}

.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:3px 9px;border:1px solid var(--line-2);border-radius:99px;color:var(--paper-2);margin:0 5px 5px 0}
.chip.o{border-color:var(--orange);color:var(--orange-br);background:rgba(225,86,15,.13)}
.chip.t{border-color:var(--teal-br);color:var(--teal-br);background:rgba(25,195,178,.11)}

.code{font-family:var(--mono);font-size:clamp(10.5px,1.48vh,13.5px);line-height:1.62;background:rgba(0,0,0,.42);
  border:1px solid var(--line);border-left:3px solid var(--teal-br);border-radius:5px;padding:13px 15px;color:var(--paper-2);white-space:pre-wrap}
.code b{color:var(--teal-br);font-weight:700}
.code .add{color:var(--teal-br)}

.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:112px;border:1px solid var(--line);border-top:3px solid var(--teal-br);border-radius:0 0 6px 6px;
  padding:13px 14px;background:rgba(255,255,255,.035);position:relative}
.step.o{border-top-color:var(--orange)}
.step .sn{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--teal-br);margin-bottom:5px}
.step.o .sn{color:var(--orange-br)}
.step .st{font-size:clamp(11.5px,1.6vh,15px);font-weight:700;line-height:1.25;margin-bottom:4px}
.step .sd{font-size:clamp(10.5px,1.45vh,13.5px);color:var(--paper-2);line-height:1.45}

.note{font-family:var(--mono);font-size:clamp(9px,1.12vh,11px);line-height:1.55;color:rgba(244,241,236,.56);
  border-top:1px solid var(--line);padding-top:9px;margin-top:12px}
.note b{color:var(--orange-br);font-weight:500}

/* ---------- COVER ---------- */
.slide.cover{justify-content:center;align-items:center;text-align:center;padding-bottom:74px;
  background:radial-gradient(1000px 700px at 50% 38%, rgba(14,142,132,.26), transparent 64%),
             radial-gradient(760px 520px at 14% 104%, rgba(225,86,15,.24), transparent 60%),
             linear-gradient(168deg,var(--steel) 0%, var(--steel-3) 60%, var(--steel-4) 100%)}
.cover .clogo{width:clamp(108px,17vh,178px);height:auto;margin-bottom:clamp(16px,2.6vh,30px);
  filter:drop-shadow(0 0 12px rgba(255,255,255,1)) drop-shadow(0 0 30px rgba(255,255,255,.62)) drop-shadow(0 0 62px rgba(255,255,255,.30))}
.cover .ceye{font-family:var(--mono);font-size:clamp(9.5px,1.28vh,13px);letter-spacing:.34em;text-transform:uppercase;color:var(--teal-br);margin-bottom:15px}
.cover h1{font-size:clamp(30px,7.4vh,82px);font-weight:900;line-height:.96;letter-spacing:-.034em;max-width:20ch;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--orange-br)}
.cover .csub{margin-top:clamp(14px,2.2vh,26px);font-size:clamp(13px,2vh,21px);line-height:1.42;color:var(--paper-2);max-width:62ch;font-weight:400}
.cover .crule{width:112px;height:3px;background:linear-gradient(90deg,var(--orange),var(--teal-br));margin:clamp(16px,2.6vh,30px) auto}
.cover .cmeta{font-family:var(--mono);font-size:clamp(9px,1.16vh,11.5px);letter-spacing:.19em;text-transform:uppercase;color:rgba(244,241,236,.58);line-height:2}

.slide.closer{justify-content:center;align-items:center;text-align:center}
.closer h1{font-size:clamp(26px,5.8vh,62px);font-weight:900;line-height:1.02;letter-spacing:-.03em;max-width:22ch;text-wrap:balance}
.closer h1 em{font-style:normal;color:var(--teal-br)}

.hint{position:fixed;left:16px;bottom:56px;z-index:20;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:rgba(244,241,236,.40);text-transform:uppercase;pointer-events:none}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}
  .tb:not(.grow):not(.keep){display:none}
  .slide{padding-left:16px;padding-right:16px}
  .hint{display:none}
}
@media (max-width:560px){
  .tb{padding:7px 10px}
  .flow{flex-direction:column}
}

/* ---------- PRINT ---------- */
@media print{
  body,#deck{height:auto;overflow:visible}
  .slide{display:flex!important;position:relative;inset:auto;page-break-after:always;height:100vh;
    background:var(--steel-4)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #nav,#bar,#idx,.hint{display:none!important}
  .body{overflow:visible}
}
</style>
</head>

<div id="bar"></div>
<div id="deck"></div>

<div id="nav">
  <button class="nbtn" id="bIdx" title="Slide index (I)">☰</button>
  <button class="nbtn" id="bPrev" title="Previous (←)">◀</button>
  <button class="nbtn" id="bNext" title="Next (→)">▶</button>
  <button class="nbtn" id="bFs" title="Fullscreen (F)">⛶</button>
</div>
<div class="hint">← → navigate &nbsp;·&nbsp; I index &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; P print</div>

<div id="idx"><h2>Contents</h2><div class="igrid" id="igrid"></div></div>

  <div class="csub">How Cleveland City Council's routine use of the emergency clause compresses the public's window to object &mdash; and the four things residents, taxpayers, and voters can do about it starting this week.</div>
  <div class="crule"></div>
  <div class="cmeta">
    Cleveland, Ohio &nbsp;·&nbsp; ${PROJECT} &nbsp;·&nbsp; ${DATE}<br>
    Prepared by The FixOurStreets216 Project &nbsp;·&nbsp; Neighborhoods First &nbsp;·&nbsp; #WeThePeople
  </div>`},

/* 02 */ {part:"HOW TO USE THIS", kicker:"Orientation", title:"What this deck is &mdash; and what it is not",
  sub:"Four audiences, one set of facts. Use the parts you need.", html:`
  <div class="grid g2">
    <div class="card t">
      <div class="eyebrow">This deck IS</div>
      <ul class="bul t">
        <li><strong>A civics explainer.</strong> How an ordinance becomes law in Cleveland, and where the public's leverage sits.</li>
        <li><strong>A data brief.</strong> Cleveland's own published legislative record, counted.</li>
        <li><strong>A legal update.</strong> Two 2026 developments changed the ground under this issue.</li>
        <li><strong>An organizing playbook.</strong> Four tiers of action, with thresholds, deadlines, and draft language.</li>
      </ul>
    </div>
    <div class="card o">
      <div class="eyebrow o">This deck is NOT</div>
      <ul class="bul">
        <li><strong>Legal advice.</strong> Charter and election-law deadlines are unforgiving. Confirm every threshold with the Clerk of Council, the Cuyahoga County Board of Elections, and your own counsel before you circulate a petition.</li>
        <li><strong>An accusation of illegality.</strong> The emergency clause is lawful. The question this deck raises is whether using it as the default is good government.</li>
        <li><strong>Partisan.</strong> Every Cleveland administration and Council of the modern era has used this tool.</li>
      </ul>
    </div>
  </div>
  <div class="grid g4" style="margin-top:16px">
    <div class="card"><div class="eyebrow">Part I</div><p style="color:var(--paper);font-weight:700">The Mechanics</p><p>How the shortcut works</p></div>
    <div class="card"><div class="eyebrow">Part II</div><p style="color:var(--paper);font-weight:700">The Scale</p><p>What the record shows</p></div>
    <div class="card"><div class="eyebrow">Part III</div><p style="color:var(--paper);font-weight:700">The Shift</p><p>2026 changed the rules</p></div>
    <div class="card"><div class="eyebrow">Part IV</div><p style="color:var(--paper);font-weight:700">The Playbook</p><p>Watch · Demand · Challenge · Amend</p></div>
  </div>`},

/* 03 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"The regular path: how a law is <em>supposed</em> to be made",
  sub:"Cleveland's standard legislative process is deliberately slow. The slowness is the feature &mdash; it is the public's window.", html:`
  <div class="flow">
    <div class="step"><div class="sn">STEP 01</div><div class="st">Drafted &amp; sponsored</div><div class="sd">By a Council member, the Mayor, or a department director. Council staff lawyers draft the text.</div></div>
    <div class="step"><div class="sn">STEP 02</div><div class="st">First reading</div><div class="sd">Introduced at a Council meeting and referred to the appropriate committee and departments.</div></div>
    <div class="step"><div class="sn">STEP 03</div><div class="st">Committee hearing</div><div class="sd">Public hearing. Amendments are proposed here. Residents may attend and speak.</div></div>
    <div class="step"><div class="sn">STEP 04</div><div class="st">Second reading</div><div class="sd">Changes are heard publicly. After this reading, no further amendments are allowed.</div></div>
    <div class="step"><div class="sn">STEP 05</div><div class="st">Third reading &amp; vote</div><div class="sd">Passes on a simple majority of Council.</div></div>
    <div class="step o"><div class="sn">STEP 06</div><div class="st">30-day wait</div><div class="sd">The ordinance does not take effect for 30 days. <strong>This is the referendum window.</strong></div></div>
  </div>
  <div class="grid g2" style="margin-top:18px">
    <div class="card t">
      <div class="eyebrow">Why three readings exist</div>
      <p>Three readings on three separate days force a bill into public view three times before it becomes binding. A resident who misses one meeting still has two more chances to learn what is coming, organize neighbors, and testify.</p>
    </div>
    <div class="card t">
      <div class="eyebrow">Why the 30 days exist</div>
      <p>The waiting period is not administrative padding. It is the only span of time in which citizens can file a referendum petition and force Council's decision onto the ballot. Shorten it and the petition right becomes theoretical.</p>
    </div>
  </div>
  <div class="note"><b>SOURCE:</b> Cleveland City Council, "Legislative Process." Ordinances and resolutions are effective 30 days after passage unless declared an emergency measure by a two-thirds vote.</div>`},

/* 04 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"The shortcut: <em>Charter Section 36</em>",
  sub:"Cleveland's home-rule charter lets Council skip the waiting period whenever two-thirds of its members say the word “emergency.”", html:`
  <div class="grid g21">
    <div>
      <blockquote class="q">An ordinance or resolution for the immediate preservation of the public peace, property, health, or safety, or providing for the usual daily operation of a Municipal department, in which the emergency is set forth and defined in a preamble&hellip;
        <cite>Cleveland Charter § 36 — Emergency Measures</cite></blockquote>
      <div class="card o" style="margin-top:16px">
        <div class="eyebrow o">Read that second clause again</div>
        <p><strong>&ldquo;&hellip;or providing for the usual daily operation of a Municipal department.&rdquo;</strong></p>
        <p>That single phrase is the whole ballgame. A genuine crisis is one path to emergency status. <em>Routine departmental business</em> is the other &mdash; and it is the one that gets used. Paving contracts, equipment purchases, and code amendments all fit comfortably inside &ldquo;usual daily operation.&rdquo;</p>
        <p>The charter never requires Council to prove urgency. It requires Council to <em>assert</em> it in a preamble.</p>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="eyebrow">What § 36 requires</div>
        <ul class="bul">
          <li><strong>Two-thirds of elected members.</strong> In a 15-member Council, that is <strong>10 votes</strong>.</li>
          <li><strong>A preamble</strong> setting forth and defining the emergency.</li>
          <li>That is the entire test.</li>
        </ul>
      </div>
      <div class="card good" style="margin-top:14px">
        <div class="eyebrow">What § 36 forbids &mdash; permanently</div>
        <p>Two categories can <strong>never</strong> be passed as emergency measures in Cleveland, no matter the vote count:</p>
        <ul class="bul t" style="margin-top:8px">
          <li>Granting, renewing, or extending a <strong>franchise</strong></li>
          <li>Regulating the <strong>rate charged by any public utility</strong> for its service</li>
        </ul>
        <p style="margin-top:8px">If you see an emergency designation on either, that is a charter question worth raising immediately.</p>
      </div>
    </div>
  </div>
  <div class="note"><b>NOTE:</b> § 36 language as published in the Cleveland Charter. Money appropriation ordinances may be passed as emergency measures. Verify current text with the Clerk of Council before relying on it.</div>`},

/* 05 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"Side by side: regular vs. emergency",
  sub:"The same ordinance, the same Council, the same room &mdash; two very different levels of public leverage.", html:`
  <table class="tbl">
    <thead><tr><th style="width:24%">Feature</th><th style="width:38%">Regular ordinance</th><th class="t" style="width:38%">Emergency ordinance</th></tr></thead>
    <tbody>
      <tr><td class="k">Vote required</td><td>Simple majority (8 of 15)</td><td>Two-thirds of all elected members (10 of 15)</td></tr>
      <tr><td class="k">Readings</td><td>Three, on three separate days &mdash; suspendable by two-thirds</td><td>Three, on three separate days &mdash; suspendable by two-thirds</td></tr>
      <tr><td class="k">Must state a reason</td><td><span class="no">No</span></td><td><span class="yes">Yes</span> &mdash; emergency must be set forth and defined in a preamble</td></tr>
      <tr><td class="k">Effective date</td><td>30 days after passage</td><td>Immediately on the Mayor's signature (or as stated in the ordinance)</td></tr>
      <tr><td class="k">Is there a pre-effect pause?</td><td><span class="yes">Yes — 30 days</span></td><td><span class="no">No</span></td></tr>
      <tr><td class="k">Referendum right</td><td><span class="yes">Yes</span> &mdash; petition within the 30-day window suspends the ordinance pending a vote</td><td><span class="yes">Usually yes in Cleveland</span>, but the ordinance stays in force while you gather. See Slide 07.</td></tr>
      <tr><td class="k">Typical use</td><td>Routine, non-urgent legislation</td><td>Contracts, capital projects, appropriations, code amendments</td></tr>
    </tbody>
  </table>
  <div class="card warn" style="margin-top:16px">
    <div class="eyebrow o">The practical difference in one sentence</div>
    <p>On a regular ordinance, the public gets <strong>30 days of leverage before anything happens</strong>. On an emergency ordinance, the contract is signed, the money moves, and the code changes <strong>before the first signature is collected</strong> &mdash; so even a successful referendum arrives after the facts on the ground are already set.</p>
  </div>`},

/* 06 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"The second shortcut: <em>suspending the readings</em>",
  sub:"The emergency clause and the readings suspension are separate tools. Used together, a bill can be introduced and binding on the same afternoon.", html:`
  <div class="grid g2">
    <div class="card o">
      <div class="eyebrow o">Tool 1 — Suspension of the three-reading rule</div>
      <p>A two-thirds vote lets Council read a bill once instead of three times. That removes the two public meetings where residents would otherwise have learned the bill existed.</p>
      <p>It also removes the committee window where amendments are normally negotiated in public.</p>
    </div>
    <div class="card o">
      <div class="eyebrow o">Tool 2 — Emergency designation</div>
      <p>A two-thirds vote makes the ordinance effective immediately instead of in 30 days. That removes the pre-effect pause.</p>
      <p>Both tools clear the same 10-vote bar. A Council willing to do one is almost always willing to do both.</p>
    </div>
  </div>
  <div class="card warn" style="margin-top:16px">
    <div class="eyebrow o">Stacked, the two tools collapse the timeline from weeks to hours</div>
    <div class="flow" style="margin-top:12px">
      <div class="step o"><div class="sn">2:00 PM</div><div class="st">Bill introduced</div><div class="sd">First appears on the agenda</div></div>
      <div class="step o"><div class="sn">2:06 PM</div><div class="st">Readings suspended</div><div class="sd">Two-thirds vote</div></div>
      <div class="step o"><div class="sn">2:11 PM</div><div class="st">Passed as emergency</div><div class="sd">Two-thirds vote</div></div>
      <div class="step o"><div class="sn">SAME WEEK</div><div class="st">Mayor signs</div><div class="sd">Law in force</div></div>
      <div class="step"><div class="sn">PUBLIC</div><div class="st">Finds out</div><div class="sd">After the fact</div></div>
    </div>
  </div>
  <div class="note"><b>NOTE:</b> A resident who reads the published agenda the morning of the meeting has, in this scenario, a few hours of notice on a law that is permanent.</div>`},

/* 07 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"The fact almost nobody knows: <em>Charter Section 64</em>",
  sub:"Cleveland's charter is more generous to voters than state law. Most emergency measures here remain subject to referendum.", html:`
  <blockquote class="q">Ordinances passed as emergency measures for the immediate preservation of the public peace, property, health, or safety and providing for the refinancing of bonds, notes or other securities of the City shall not be subject to referendum. <strong>Otherwise, emergency measures shall be subject to referendum in like manner as other ordinances, except that they shall go into effect at the time indicated in the ordinances.</strong>
    <cite>Cleveland Charter § 64 — Referendum on Emergency Measures (effective Nov. 4, 2008)</cite></blockquote>
  <div class="grid g3" style="margin-top:16px">
    <div class="card good"><div class="eyebrow">What this means</div><p>In Cleveland, an emergency designation buys Council <strong>speed</strong> &mdash; it does not, on its face, buy immunity from the voters. The exemption in the first sentence is written narrowly.</p></div>
    <div class="card good"><div class="eyebrow">What you still lose</div><p>The ordinance <strong>takes effect and stays in effect</strong> while you circulate. Unlike a regular ordinance, it is not suspended by the filing of a petition. You are undoing a live law, not pausing a pending one.</p></div>
    <div class="card"><div class="eyebrow o">If voters reject it</div><p>§ 64 provides the measure is <strong>considered repealed as regards any further action</strong> &mdash; but money already spent under it stays spent. Speed still wins the ground.</p></div>
  </div>
  <div class="card warn" style="margin-top:16px">
    <div class="eyebrow o">Action item for counsel</div>
    <p>The first sentence of § 64 joins two conditions with <strong>&ldquo;and&rdquo;</strong>: measures for immediate preservation of peace/property/health/safety <em>and</em> providing for refinancing of City securities. Read conjunctively, the referendum exemption reaches only bond-refinancing emergencies &mdash; a very small slice of Council's emergency output. Get a written opinion on this reading from the Clerk of Council and from an election-law attorney <strong>before</strong> you assume any given emergency ordinance is beyond reach.</p>
  </div>`},

/* 08 */ {part:"PART I — THE MECHANICS", kicker:"Part I · The Mechanics", title:"What state law says &mdash; and why it matters less here",
  sub:"Ohio Revised Code § 731.30 is the rule for non-charter municipalities. Cleveland is a home-rule charter city, so the charter controls.", html:`
  <div class="grid g2">
    <div class="card o">
      <div class="eyebrow o">ORC § 731.30 — the state default</div>
      <ul class="bul">
        <li>Emergency ordinances must be <strong>necessary for the immediate preservation of the public peace, health, or safety</strong>.</li>
        <li>The <strong>reasons must be stated in one section</strong> of the measure.</li>
        <li>A <strong>two-thirds vote</strong> of all members elected is required.</li>
        <li>Such measures <strong>go into immediate effect</strong>, outside the ordinary referendum procedure.</li>
      </ul>
      <p style="margin-top:9px">Notice what the statute does <em>not</em> contain: the &ldquo;usual daily operation of a municipal department&rdquo; language. That phrase is Cleveland's own charter addition.</p>
    </div>
    <div class="card t">
      <div class="eyebrow">Why Cleveland is different</div>
      <p>Under <strong>Ohio Constitution, Article XVIII</strong>, a charter city writes its own rules of local self-government. Cleveland's charter is therefore the operative law on emergency measures, readings, and referendum.</p>
      <p>That cuts both ways:</p>
      <ul class="bul t" style="margin-top:8px">
        <li><strong>Against residents:</strong> § 36's &ldquo;usual daily operation&rdquo; clause is broader than the state standard.</li>
        <li><strong>For residents:</strong> § 64 preserves referendum on emergency measures far more generously than ORC § 731.30 does.</li>
        <li><strong>For residents:</strong> the charter itself can be amended by the voters. State law cannot.</li>
      </ul>
    </div>
  </div>
  <div class="note"><b>TAKEAWAY:</b> Any argument you make &mdash; in testimony, in the press, or in court &mdash; should cite the <b>Cleveland Charter first</b> and the Revised Code second. Advice written for Ohio cities generally will understate the rights Clevelanders actually hold.</div>`},

/* 09 */ {part:"PART II — THE SCALE", kicker:"Part II · The Scale", title:"The numbers",
  sub:"Cleveland Documenters analyzed The City Record for every ordinance passed between January 2020 and May 2021. This is what the legislative record shows.", html:`
  <div class="grid g3">
    <div class="stat"><div class="big">97%</div><div class="lab">of ordinances passed<br>were declared<br>emergency measures</div></div>
    <div class="stat"><div class="big">99.5%</div><div class="lab">of the time, Council<br>suspended the<br>three-reading rule</div></div>
    <div class="stat"><div class="big">26%</div><div class="lab">of all legislation passed<br>the same day<br>it was introduced</div></div>
  </div>
  <div class="grid g2" style="margin-top:18px">
    <div class="card o">
      <div class="eyebrow o">What 97% tells you</div>
      <p>A tool built for the exceptional case is being applied to essentially the entire body of municipal law. When the exception covers 97 percent of the output, the exception <em>is</em> the process &mdash; and the process described on the Council's own website is the exception.</p>
    </div>
    <div class="card o">
      <div class="eyebrow o">What 99.5% tells you</div>
      <p>The three-reading rule is the mechanism that gives residents advance notice. Suspended in 199 cases out of every 200, notice is not a right in practice. It is a courtesy extended when nobody objects.</p>
    </div>
  </div>
  <div class="note"><b>SOURCE:</b> Cleveland Documenters analysis of The City Record, reported by The Land, "The pace of passage: How quickly city council makes laws and what that means for Clevelanders." Figures cover Jan. 2020 &ndash; May 2021. <b>Recommended next step:</b> replicate this count for 2024&ndash;2026 from Legistar and publish it.</div>`},

/* 10 */ {part:"PART II — THE SCALE", kicker:"Part II · The Scale", title:"Where the money moves fastest",
  sub:"Same-day passage is not spread evenly. It concentrates where dollars are allocated.", html:`
  <div class="grid g12">
    <div>
      <div class="stat tl"><div class="big">$9.7M</div><div class="lab">annual casino revenue funds &mdash; more than half of all same-day-passage legislation in the study period</div></div>
    </div>
    <div>
      <div class="card t">
        <div class="eyebrow">Why this matters more than it sounds</div>
        <p>Casino revenue is discretionary money. Unlike a bond payment or a state-mandated transfer, someone chooses where it goes &mdash; which ward, which program, which vendor.</p>
        <p>Discretionary spending is precisely the category where public review has the most to offer and where the absence of review is most costly. When over half of same-day legislation is discretionary allocation, the public is being locked out of the decisions it has the clearest stake in.</p>
      </div>
    </div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    <div class="card"><div class="eyebrow o">Typical emergency subject matter</div><ul class="bul"><li>Roadway and bridge improvement contracts</li><li>Vehicle impound and towing code amendments</li><li>Sidewalk and right-of-way code restructuring</li></ul></div>
    <div class="card"><div class="eyebrow o">Also routinely emergency</div><ul class="bul"><li>Pedestrian and bicycle infrastructure</li><li>Purchasing and professional services contracts</li><li>Departmental appropriations and transfers</li></ul></div>
    <div class="card warn"><div class="eyebrow o">Ask yourself</div><p>Which of these is an emergency in the sense an ordinary Clevelander would use the word? Each may be <em>urgent</em> to a department's calendar. That is not the same thing as a threat to public safety.</p></div>
  </div>`},

/* 11 */ {part:"PART II — THE SCALE", kicker:"Part II · The Scale", title:"Council's case for doing it this way",
  sub:"State it fairly. An argument you cannot summarize honestly is one you cannot beat.", html:`
  <blockquote class="q">The clerk's office, if there's no objection, then they're going to take the efficient route to move the legislation along and tag it with emergency.
    <cite>Council Member Blaine Griffin, quoted in The Land</cite></blockquote>
  <div class="grid g3" style="margin-top:16px">
    <div class="card t"><div class="eyebrow">Argument 1 — Construction seasons are short</div><p>Northeast Ohio has a narrow paving and building window. A 30-day delay in the spring can push a project a full year and raise its cost.</p></div>
    <div class="card t"><div class="eyebrow">Argument 2 — Grant and contract deadlines are real</div><p>State and federal awards carry obligation deadlines. Missing one can forfeit the money entirely.</p></div>
    <div class="card t"><div class="eyebrow">Argument 3 — Operations cannot stop</div><p>Payroll, fuel, salt, equipment, and service contracts have to be authorized continuously. A city that waited 30 days on every one of them would not function.</p></div>
  </div>
  <div class="card warn" style="margin-top:16px">
    <div class="eyebrow o">The honest response</div>
    <p>All three arguments are sound &mdash; <strong>for the ordinances they actually describe</strong>. None of them justifies a blanket 97 percent. The reform this deck argues for is not abolishing the emergency clause. It is <strong>separating the ordinances that genuinely need speed from the ones that are simply easier to pass without scrutiny</strong>, and making Council say on the record which is which.</p>
    <p>Note the mechanism in the quote above: the tag goes on <strong>&ldquo;if there's no objection.&rdquo;</strong> That is the opening. Objection is free, and it is available to any member and any resident at the podium.</p>
  </div>`},

/* 12 */ {part:"PART II — THE SCALE", kicker:"Part II · The Scale", title:"What the public actually loses",
  sub:"Not abstractions. Six concrete, enumerable capabilities.", html:`
  <div class="grid g2">
    <div>
      <ol class="num">
        <li><strong>Advance notice</strong>Three readings across three meetings become one. Residents learn about a law after it binds them.</li>
        <li><strong>The organizing window</strong>Thirty days is roughly what a volunteer coalition needs to read a bill, brief a block club, and decide whether to act. Zero days is not a window.</li>
        <li><strong>The suspensive effect</strong>On a regular ordinance, filing a petition freezes the law. On an emergency ordinance, the law runs while you gather signatures.</li>
      </ol>
    </div>
    <div>
      <ol class="num" start="4" style="counter-reset:s 3">
        <li><strong>Amendment leverage</strong>Most citizen influence is not a veto &mdash; it is a change negotiated in committee. Suspended readings eliminate the committee window where that happens.</li>
        <li><strong>Comparison shopping</strong>Thirty days lets a resident pull the contract, check the vendor, and compare the price. Same-day passage means the audit happens, if at all, after the check clears.</li>
        <li><strong>A real threat</strong>The referendum's power is mostly deterrent. A Council that knows a bad deal can be put to the voters negotiates differently. Remove the credible threat and you remove the pressure that produces better deals in the first place.</li>
      </ol>
    </div>
  </div>
  <div class="card warn" style="margin-top:14px">
    <div class="eyebrow o">The compounding effect</div>
    <p>Each of these alone is survivable. Together and applied to 97 percent of legislation, they add up to a city government that is fully legal, fully elected, and functionally unreviewable between elections. Voters still choose who sits on Council. They no longer get a say on what Council does while seated.</p>
  </div>`},

/* 13 */ {part:"PART II — THE SCALE", kicker:"Part II · The Scale", title:"How other cities handle the same problem",
  sub:"Cleveland's practice is a choice, not a necessity. Peer cities run on shorter clocks without emergency clauses.", html:`
  <table class="tbl">
    <thead><tr><th style="width:18%">City</th><th style="width:30%">Minimum time from introduction to final action</th><th style="width:26%">Emergency clause used?</th><th style="width:26%">What Cleveland could learn</th></tr></thead>
    <tbody>
      <tr><td class="k">Pittsburgh, PA</td><td>At least <strong>seven days</strong> between introduction and final action</td><td><span class="yes">No &mdash; does not use emergency ordinances</span></td><td>A hard minimum floor is workable in a major city. Seven days is enough to publish, notice, and hear.</td></tr>
      <tr><td class="k">Akron, OH</td><td>Three-reading requirement comparable to Cleveland's</td><td>Yes, under Ohio practice</td><td>Same legal toolkit &mdash; the question is the rate of use, which is a matter of Council rules and culture.</td></tr>
      <tr><td class="k">Cleveland, OH</td><td><strong>None in practice</strong> &mdash; roughly a quarter of legislation passes the day it is introduced</td><td>Yes &mdash; roughly 97% of ordinances in the study period</td><td>&mdash;</td></tr>
    </tbody>
  </table>
  <div class="grid g2" style="margin-top:16px">
    <div class="card good">
      <div class="eyebrow">The Pittsburgh point is the strongest one you have</div>
      <p>Pittsburgh is a comparably sized, comparably old, comparably constrained industrial city with the same short construction season, the same grant deadlines, and the same procurement cycles. It manages without emergency ordinances and with a seven-day floor.</p>
      <p>That makes the efficiency argument answerable: <strong>a peer city does the same work under a stricter clock</strong>. The burden shifts to explaining why Cleveland cannot.</p>
    </div>
    <div class="card">
      <div class="eyebrow o">How to use this slide</div>
      <ul class="bul"><li>In testimony: ask Council to respond to Pittsburgh specifically.</li>
      <li>With reporters: this is the comparison that makes the story concrete.</li>
      <li>In a charter campaign: a seven-day floor is a modest, precedented ask that is hard to call radical.</li></ul>
    </div>
  </div>
  <div class="note"><b>SOURCE:</b> Comparative practice as reported by The Land. Confirm current Pittsburgh and Akron council rules directly before citing in formal testimony.</div>`},

/* 14 */ {part:"PART III — THE SHIFT", kicker:"Part III · The Shift", title:"2026 changed the ground under this issue",
  sub:"Two developments &mdash; one local, one from the Ohio Supreme Court &mdash; make this the strongest moment in years to press the question.", html:`
  <div class="grid g2">
    <div class="card good">
      <div class="eyebrow">Development 1 — Local proof of concept</div>
      <p style="color:var(--paper);font-weight:700;font-size:1.08em">Cleveland's Flock referendum</p>
      <p>An emergency designation failed by a single vote, the 30-day window opened, and residents moved on it. The referendum right is not theoretical in Cleveland. It was exercised this year.</p>
      <div style="margin-top:10px"><span class="chip t">July 17, 2026</span><span class="chip t">Ordinance 683-2026</span><span class="chip t">9&ndash;6 vote</span></div>
    </div>
    <div class="card good">
      <div class="eyebrow">Development 2 — Statewide legal standard</div>
      <p style="color:var(--paper);font-weight:700;font-size:1.08em">State ex rel. McNamara-Smith v. Grube</p>
      <p>The Ohio Supreme Court held that a boilerplate emergency preamble is not good enough to defeat a referendum petition. Councils now have to actually explain the emergency.</p>
      <div style="margin-top:10px"><span class="chip t">Aug. 7, 2026</span><span class="chip t">2026-Ohio-3035</span><span class="chip t">Unanimous outcome for petitioners</span></div>
    </div>
  </div>
  <div class="card warn" style="margin-top:16px">
    <div class="eyebrow o">Why the timing matters</div>
    <p>Reform arguments succeed when they arrive with proof that the current system has already failed in a way people can point at. Cleveland now has a local example the whole city watched, and a statewide ruling that gives the argument legal teeth. <strong>Both landed within four weeks of each other.</strong></p>
  </div>`},

/* 15 */ {part:"PART III — THE SHIFT", kicker:"Part III · Case Study", title:"Case study: the Flock referendum",
  sub:"What happens when the emergency clause fails by one vote.", html:`
  <div class="flow">
    <div class="step"><div class="sn">JULY 17, 2026</div><div class="st">Council votes 9&ndash;6</div><div class="sd">To extend the city's Flock surveillance camera contract six months via Ordinance 683-2026.</div></div>
    <div class="step o"><div class="sn">THE MARGIN</div><div class="st">One vote short</div><div class="sd">Emergency status needed 10 of 15. Nine is a majority &mdash; enough to pass, not enough to shield.</div></div>
    <div class="step"><div class="sn">RESULT</div><div class="st">30-day window opens</div><div class="sd">Charter § 59 applies: the ordinance cannot take effect for 30 days.</div></div>
    <div class="step"><div class="sn">THRESHOLD</div><div class="st">~4,400 signatures</div><div class="sd">10% of the 43,358 votes cast in the 2025 municipal election. Organizers targeted 4,500+ for cushion.</div></div>
    <div class="step"><div class="sn">EFFECT</div><div class="st">Filing suspends it</div><div class="sd">A sufficient petition stops the ordinance from becoming operative pending the vote.</div></div>
  </div>
  <blockquote class="q" style="margin-top:18px">If at any time within said thirty (30) days, a petition&hellip;be filed with the Clerk of the Council requesting that the ordinance&hellip;be repealed or submitted to a vote of the electors, it shall not become operative.
    <cite>Cleveland Charter § 59, as quoted in reporting on the Flock referendum</cite></blockquote>
  <div class="grid g3" style="margin-top:16px">
    <div class="card good"><div class="eyebrow">Lesson 1</div><p><strong>Six votes is a win.</strong> Residents do not need a Council majority to preserve their own rights. They need <strong>six members willing to withhold the emergency</strong> &mdash; a far more achievable organizing target than eight.</p></div>
    <div class="card good"><div class="eyebrow">Lesson 2</div><p><strong>The signature math is knowable in advance.</strong> Ten percent of the last municipal election turnout is a number you can compute today and plan around before a bill is ever introduced.</p></div>
    <div class="card good"><div class="eyebrow">Lesson 3</div><p><strong>The right works when the window exists.</strong> Every argument in this deck reduces to protecting that window. Flock is the proof.</p></div>
  </div>
  <div class="note"><b>NOTE:</b> Signature thresholds and filing deadlines must be confirmed with the Clerk of Council and the Cuyahoga County Board of Elections for the specific ordinance and election cycle at issue. Figures above are as reported.</div>`},

/* 16 */ {part:"PART III — THE SHIFT", kicker:"Part III · The Shift", title:"The landmark: <em>McNamara-Smith v. Grube</em>",
  sub:"Ohio Supreme Court, August 7, 2026. The emergency clause is no longer a magic word.", html:`
  <div class="grid g21">
    <div>
      <div class="card t">
        <div class="eyebrow">The facts</div>
        <p>The village of Ashville adopted Resolution 06-2026 approving a development agreement with EdgeConneX for two data centers and a natural gas power plant. Residents gathered enough signatures for a referendum. <strong>The fiscal officer refused to submit the petition</strong>, claiming the emergency designation exempted the resolution from referendum.</p>
      </div>
      <div class="card good" style="margin-top:14px">
        <div class="eyebrow">The holding</div>
        <ul class="bul t">
          <li>Reciting the statutory words &mdash; <em>&ldquo;public peace, health, or safety&rdquo;</em> &mdash; is <strong>not sufficient</strong>. In the Court's phrase, <strong>&ldquo;parroting R.C. 731.30&hellip;is not enough.&rdquo;</strong></li>
          <li>The measure must give <strong>specific reasons</strong> why emergency status was necessary.</li>
          <li>The emergency clause was invalid because it offered only <strong>conclusory statements</strong> and never explained why a 30-day delay would harm the project.</li>
          <li><strong>After-the-fact justifications do not count.</strong> The reasoning has to be in the measure.</li>
          <li>Whether an action is legislative or administrative is <strong>a judicial question</strong> &mdash; not one a municipal officer gets to decide by refusing to certify a petition.</li>
        </ul>
      </div>
    </div>
    <div>
      <div class="card warn">
        <div class="eyebrow o">Why this is the most useful slide in the deck</div>
        <p>Before <em>Grube</em>, a resident challenging an emergency designation was arguing about good government. After <em>Grube</em>, that resident is arguing about <strong>a legal defect in the ordinance</strong>.</p>
        <p>That changes who has to answer. A Council can decline to debate whether a practice is democratic. It cannot as easily decline to explain why its preamble satisfies a standard the Ohio Supreme Court announced last month.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow o">Already rippling</div>
        <p>In Circleville, the local group Teays Valley Against Overgrowth began auditing council ordinances for the phrase &ldquo;declaring an emergency&rdquo; immediately after the ruling &mdash; including a tax credit for Health Care Logistics and a pending 1,200-home annexation.</p>
        <p>That audit is a template. It is Tier 1 of the playbook that follows.</p>
      </div>
    </div>
  </div>`},

/* 17 */ {part:"PART III — THE SHIFT", kicker:"Part III · The Shift", title:"The new test for a valid emergency preamble",
  sub:"Read every emergency preamble against these five questions. If it fails, say so on the record.", html:`
  <div class="grid g2">
    <div class="card good">
      <div class="eyebrow">A preamble that likely SURVIVES review</div>
      <div class="code">WHEREAS, the City's ODOT LPA agreement for the
E. 55th Street resurfacing requires the City to
encumber local match funds <b>on or before
October 15, 2026</b>, and the next available regular
effective date falls <b>eleven days after</b> that
deadline; and

WHEREAS, failure to encumber by that date
<b>forfeits $2.4 million</b> in obligated federal
funds and returns the project to the FY2029
application cycle; now, therefore&hellip;</div>
      <p style="margin-top:10px">Names a <strong>date</strong>. Names a <strong>consequence</strong>. Shows the <strong>arithmetic</strong> of why 30 days does not work. This is a real emergency, explained.</p>
    </div>
    <div class="card warn">
      <div class="eyebrow o">A preamble that likely FAILS under <em>Grube</em></div>
      <div class="code" style="border-left-color:var(--orange)">WHEREAS, this ordinance constitutes an
emergency measure providing for the usual
daily operation of a municipal department;
now, therefore&hellip;</div>
      <p style="margin-top:10px">Names no date, no deadline, no consequence, and no reason a 30-day wait would cause harm. It recites a category. Under <em>Grube</em>, reciting the category is precisely what is <strong>not enough</strong>.</p>
      <p style="margin-top:9px"><strong>If most of Cleveland's emergency preambles look like the box above, that is a finding worth publishing.</strong></p>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="eyebrow o">The five-question preamble test</div>
    <div class="grid g4" style="margin-top:10px">
      <div class="card t"><p><strong>1.</strong> Does it name a <strong>specific date or deadline</strong>?</p></div>
      <div class="card t"><p><strong>2.</strong> Does it name a <strong>specific harm</strong> from waiting 30 days?</p></div>
      <div class="card t"><p><strong>3.</strong> Is the harm <strong>quantified</strong> &mdash; dollars, a season, a forfeited award?</p></div>
      <div class="card t"><p><strong>4.</strong> Is the reasoning <strong>inside the ordinance</strong>, not offered later?</p></div>
    </div>
    <div class="card t" style="margin-top:10px"><p><strong>5.</strong> Would that reasoning persuade a judge who has never heard of the project &mdash; or does it only work if you already trust the department? <em>A preamble that fails questions 1 through 4 fails question 5 automatically.</em></p></div>
  </div>`},

/* 18 */ {part:"PART IV — THE PLAYBOOK", kicker:"Part IV · The Playbook", title:"Four tiers of citizen power",
  sub:"Escalating by cost and difficulty. Almost everyone should start at Tier 1. Almost nobody should start at Tier 4.", html:`
  <div class="grid g4">
    <div class="card t"><div class="eyebrow">Tier 1</div><h3>WATCH</h3><p>Know what is coming before it passes. Free, legal, and requires no permission from anyone.</p><div style="margin-top:9px"><span class="chip t">Cost: hours/week</span><span class="chip t">People: 1&ndash;5</span></div></div>
    <div class="card t"><div class="eyebrow">Tier 2</div><h3>DEMAND</h3><p>Make Council justify each emergency on the record, in public, before the vote.</p><div style="margin-top:9px"><span class="chip t">Cost: low</span><span class="chip t">People: 5&ndash;25</span></div></div>
    <div class="card o"><div class="eyebrow o">Tier 3</div><h3>CHALLENGE</h3><p>Use the referendum right, or challenge a defective emergency clause under <em>Grube</em>.</p><div style="margin-top:9px"><span class="chip o">Cost: high</span><span class="chip o">People: 100+</span></div></div>
    <div class="card o"><div class="eyebrow o">Tier 4</div><h3>AMEND</h3><p>Change the rules themselves &mdash; Council rules first, the charter if necessary.</p><div style="margin-top:9px"><span class="chip o">Cost: highest</span><span class="chip o">People: 500+</span></div></div>
  </div>
  <div class="card warn" style="margin-top:18px">
    <div class="eyebrow o">The strategic logic</div>
    <p>Tiers 1 and 2 are not a warm-up for the real work &mdash; they <em>are</em> a large share of the available leverage. Recall the mechanism Council described: the emergency tag goes on <strong>&ldquo;if there's no objection.&rdquo;</strong> A standing, visible, well-informed objection changes the default at almost no cost.</p>
    <p>Tiers 3 and 4 are what you hold in reserve. Their value is mostly in being <strong>credible</strong>. A city that knows residents can and will gather 4,400 signatures behaves differently than one that does not &mdash; whether or not the petition is ever filed.</p>
  </div>`},

/* 19 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 1 · Watch", title:"Tier 1 &mdash; <em>Watch:</em> build the early-warning system",
  sub:"You cannot object to what you did not see. Everything here is public and free.", html:`
  <div class="grid g2">
    <div>
      <ol class="num">
        <li><strong>Set up a Legistar routine</strong>Cleveland publishes every ordinance, its sponsors, its committee, its status, and its full text on the city's Legistar portal. Check it the day agendas post &mdash; not the day of the meeting.</li>
        <li><strong>Read The City Record weekly</strong>The official journal of Council proceedings. It is the primary source for any count you publish, and it is what makes your numbers unarguable.</li>
        <li><strong>Follow Cleveland Documenters and Signal Cleveland</strong>Trained residents already attend and take notes on these meetings. Do not duplicate that labor &mdash; build on it and cite it.</li>
        <li><strong>Keep a running emergency log</strong>One spreadsheet row per ordinance: file number, date, subject, sponsor, dollar amount, readings suspended Y/N, emergency Y/N, preamble text. After ninety days you will have something no press release can rebut.</li>
      </ol>
    </div>
    <div>
      <div class="card t">
        <div class="eyebrow">The 7-question agenda triage</div>
        <p>For each emergency item, answer these before the meeting. Most take under five minutes.</p>
        <ul class="bul t" style="margin-top:10px">
          <li><strong>What does it actually do?</strong> Contract, code change, appropriation, land, or policy?</li>
          <li><strong>Who benefits?</strong> Name the vendor, developer, or department.</li>
          <li><strong>How much?</strong> Dollar figure and funding source.</li>
          <li><strong>Whose ward?</strong> Is your council member a sponsor?</li>
          <li><strong>Does the preamble pass the five-question test?</strong> (Slide 17)</li>
          <li><strong>Is it a franchise or a utility rate?</strong> If so, it cannot lawfully be an emergency under § 36 &mdash; escalate immediately.</li>
          <li><strong>Would a 30-day delay actually hurt anyone?</strong> If you cannot articulate the harm, neither can they.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="note"><b>TIP:</b> One person doing this consistently for one committee is worth more than twenty people doing it once. Assign committees, not meetings.</div>`},

/* 20 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 2 · Demand", title:"Tier 2 &mdash; <em>Demand:</em> force the justification on the record",
  sub:"The goal is not to win every vote. It is to make the emergency designation cost something.", html:`
  <div class="grid g2">
    <div class="card t">
      <div class="eyebrow">At the podium — public comment</div>
      <p>Cleveland Council takes public comment early in its meetings. Use the slot surgically. A script that works:</p>
      <div class="code" style="margin-top:10px">&ldquo;I'm here on Ordinance <b>___</b>. I'm not asking
you to vote it down. I'm asking you to pass it
<b>without the emergency clause</b>.

The preamble says this is for the usual daily
operation of a department. It doesn't say what
happens if it takes effect in 30 days instead of
today. In <b>McNamara-Smith v. Grube</b>, decided
August 7th, the Ohio Supreme Court held that
parroting the statute isn't enough.

If there is a real deadline, put it in the
preamble and I'll support the emergency. If
there isn't one, let the 30 days run.&rdquo;</div>
    </div>
    <div>
      <div class="card t">
        <div class="eyebrow">With your council member</div>
        <ul class="bul t">
          <li><strong>Ask for the six.</strong> Emergency status needs 10 of 15. Six members declining is enough to preserve the public's window &mdash; without defeating the underlying bill.</li>
          <li><strong>Frame it as leverage, not opposition.</strong> A member can support a project and still decline to shield it. That is a defensible position to take home to a ward.</li>
          <li><strong>Ask in writing, and publish the answer.</strong> &ldquo;Will you commit to withholding the emergency clause on any ordinance whose preamble does not state a specific deadline?&rdquo;</li>
        </ul>
      </div>
      <div class="card good" style="margin-top:14px">
        <div class="eyebrow">The sponsor scorecard</div>
        <p>Publish a simple monthly tally by member: emergency votes cast, readings suspensions supported, and objections raised. Councils respond to being counted. The scorecard is the single cheapest instrument of accountability available to residents.</p>
      </div>
    </div>
  </div>`},

/* 21 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 3 · Challenge", title:"Tier 3A &mdash; <em>Challenge:</em> the referendum path",
  sub:"The nuclear option, mapped. Know the clock before you need it.", html:`
  <div class="flow">
    <div class="step"><div class="sn">DAY 0</div><div class="st">Council passes</div><div class="sd">Clock starts on the date of passage. Confirm the exact date with the Clerk.</div></div>
    <div class="step"><div class="sn">DAY 0&ndash;2</div><div class="st">Draft the petition</div><div class="sd">Form, ordinance text, circulator statement. Election-law counsel is not optional here.</div></div>
    <div class="step"><div class="sn">DAY 2&ndash;26</div><div class="st">Circulate</div><div class="sd">Registered Cleveland electors only. Target 150% of the threshold.</div></div>
    <div class="step"><div class="sn">DAY 26&ndash;28</div><div class="st">Verify internally</div><div class="sd">Check registrations against the Board of Elections file before filing, not after.</div></div>
    <div class="step o"><div class="sn">BY DAY 30</div><div class="st">File with the Clerk</div><div class="sd">File with the Clerk of Council. Late by one day is fatal.</div></div>
    <div class="step"><div class="sn">THEN</div><div class="st">Ballot</div><div class="sd">Certified to the Board of Elections for the next eligible election.</div></div>
  </div>
  <div class="grid g3" style="margin-top:18px">
    <div class="card o">
      <div class="eyebrow o">The signature math</div>
      <p>Threshold is <strong>10% of the votes cast at the last regular municipal election</strong>.</p>
      <p>Worked example from 2026: 43,358 votes cast in 2025 &rarr; roughly <strong>4,400 valid signatures</strong>. Organizers were advised to collect <strong>4,500+</strong> to absorb invalidations. Plan on 6,000&ndash;6,600 raw.</p>
    </div>
    <div class="card o">
      <div class="eyebrow o">The emergency wrinkle</div>
      <p>On a <strong>regular</strong> ordinance, filing suspends the law pending the vote.</p>
      <p>On an <strong>emergency</strong> measure under § 64, the law is already in effect and <strong>stays in effect</strong> while you circulate. You are repealing, not pausing. Budget for that difference politically.</p>
    </div>
    <div class="card warn">
      <div class="eyebrow o">Where petitions die</div>
      <ul class="bul"><li>Signers who are not registered at the address given</li><li>Circulator statement defects</li><li>Part-petitions filed separately or late</li><li>Wrong summary or ordinance text attached</li><li>Filing one day past the window</li></ul>
      <p style="margin-top:8px"><strong>Almost every failed Ohio referendum fails on form, not on support.</strong></p>
    </div>
  </div>
  <div class="note"><b>CRITICAL:</b> Confirm the threshold, the base election, the filing officer, and the deadline with the Clerk of Council and the Cuyahoga County Board of Elections <b>before</b> you print a single part-petition. Figures here are illustrative, drawn from 2026 reporting.</div>`},

/* 22 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 3 · Challenge", title:"Tier 3B &mdash; <em>Challenge:</em> attack the emergency clause itself",
  sub:"After <em>Grube</em>, a defective preamble is a legal vulnerability &mdash; and the remedy is that the referendum right survives.", html:`
  <div class="grid g2">
    <div>
      <ol class="num">
        <li><strong>Preserve the record before the vote</strong>Testify. State on the record that the preamble states no specific deadline or harm, and cite <em>McNamara-Smith v. Grube</em> by name and date. A contemporaneous objection is far stronger than one raised months later.</li>
        <li><strong>Put the request in writing</strong>Email the sponsor, the committee chair, and the Clerk asking what specific harm a 30-day delay would cause. Keep the reply &mdash; or the absence of one.</li>
        <li><strong>File the petition anyway</strong>If the Clerk or another officer refuses to accept or certify it on emergency grounds, that refusal is the thing <em>Grube</em> addresses: whether the measure is subject to referendum is <strong>a judicial question</strong>, not an administrative one.</li>
        <li><strong>Seek a writ</strong>Ohio referendum disputes move through mandamus actions on an expedited election calendar. This is attorney work &mdash; retain counsel early, not after a refusal.</li>
      </ol>
    </div>
    <div>
      <div class="card good">
        <div class="eyebrow">What <em>Grube</em> gives you</div>
        <ul class="bul t">
          <li>Boilerplate preambles are <strong>reviewable</strong>.</li>
          <li>The city <strong>cannot backfill</strong> justification after the fact.</li>
          <li>A municipal officer <strong>cannot unilaterally decide</strong> that a measure is beyond referendum.</li>
          <li>The remedy is that the measure <strong>remains subject to referendum</strong> &mdash; the petition proceeds.</li>
        </ul>
      </div>
      <div class="card warn" style="margin-top:14px">
        <div class="eyebrow o">What <em>Grube</em> does not give you</div>
        <ul class="bul">
          <li>It does not invalidate ordinances with <strong>genuine, specific</strong> emergency justifications.</li>
          <li>It does not extend a deadline you missed.</li>
          <li>It arose under ORC § 731.30 in a village. <strong>Cleveland is a charter city</strong>, so expect argument about how directly it applies &mdash; though Cleveland's own § 36 likewise requires the emergency to be &ldquo;set forth and defined&rdquo; in a preamble, which is the same idea.</li>
        </ul>
      </div>
    </div>
  </div>`},

/* 23 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 4 · Amend", title:"Tier 4A &mdash; <em>Amend:</em> change Council's own rules first",
  sub:"The cheapest structural fix requires no election, no signatures, and no lawyer. It requires eight votes.", html:`
  <div class="card t">
    <div class="eyebrow">Why start here</div>
    <p>Council adopts its own rules of procedure. A rules change cannot override the charter, but it can bind Council's <em>practice</em> &mdash; and it can be adopted by simple majority in a single meeting. It is the highest-leverage, lowest-cost ask in this deck, and it is very hard to argue against in public.</p>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div>
      <div class="card">
        <div class="eyebrow o">Proposed Rule — Emergency Justification Standard</div>
        <div class="code">No ordinance shall be placed on the agenda with
an emergency designation unless its preamble
states:

  <b>(a)</b> the <b>specific date or deadline</b> creating
      the urgency;
  <b>(b)</b> the <b>specific harm</b> — in dollars, in
      forfeited funds, or in days lost — that
      would result from the ordinary 30-day
      effective date; and
  <b>(c)</b> why that harm <b>cannot be avoided</b> by
      scheduling the ordinance earlier.

A designation that recites only the categories
of Charter § 36 shall be <b>out of order</b>.</div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="eyebrow o">Proposed Rule — Separate Roll Call</div>
        <div class="code">The emergency designation shall be voted
<b>separately</b> from passage of the ordinance,
and the vote shall be recorded by <b>yea and nay</b>
in the journal.</div>
        <p style="margin-top:10px">This is the quiet powerhouse. Today a member who supports a project must accept the emergency clause bundled with it. Separate the votes and a member can say <strong>&ldquo;yes to the project, no to the shortcut&rdquo;</strong> &mdash; and constituents can see exactly who did.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow o">Proposed Rule — Quarterly Emergency Report</div>
        <div class="code">The Clerk shall publish quarterly the number and
percentage of ordinances passed as emergency
measures and with readings suspended, by
committee and by sponsor.</div>
        <p style="margin-top:10px">Measurement changes behavior before any rule does. And it costs the Clerk a query.</p>
      </div>
    </div>
  </div>`},

/* 24 */ {part:"PART IV — THE PLAYBOOK", kicker:"Tier 4 · Amend", title:"Tier 4B &mdash; <em>Amend:</em> the charter route",
  sub:"If Council will not bind itself, the voters can. Draft language to start the conversation.", html:`
  <div class="grid g21">
    <div>
      <div class="card">
        <div class="eyebrow o">Draft charter amendment — for discussion with counsel</div>
        <div class="code">PROPOSED AMENDMENT TO SECTION 36 OF THE
CHARTER OF THE CITY OF CLEVELAND

Section 36 is amended by adding the following:

<b class="add">No ordinance or resolution shall be passed as an
emergency measure unless its preamble states
with particularity the specific date, deadline,
or condition giving rise to the emergency and
the specific injury to the City that would
result from the ordinary effective date.</b>

<b class="add">A preamble that recites only the general
categories of this Section, without such
particulars, shall not be sufficient to
constitute an emergency measure.</b>

<b class="add">The Clerk shall publish, not less than seven
(7) days before final action, the full text of
any ordinance proposed to be passed as an
emergency measure, together with its preamble.</b>

<b class="add">The declaration of emergency shall be voted upon
separately from the passage of the ordinance,
and both votes shall be recorded by yea and nay.</b></div>
      </div>
    </div>
    <div>
      <div class="card t">
        <div class="eyebrow">The two routes to the ballot</div>
        <ul class="bul t">
          <li><strong>Route A &mdash; Council refers it.</strong> A two-thirds vote of Council submits an amendment to the electors. Fastest, no signatures. Ask for it first; a refusal is itself a story.</li>
          <li><strong>Route B &mdash; Petition.</strong> Under Ohio Constitution Art. XVIII § 9, a petition signed by <strong>10 percent of the electors of the municipality</strong> requires Council to submit the amendment to the voters.</li>
        </ul>
      </div>
      <div class="card warn" style="margin-top:14px">
        <div class="eyebrow o">Design the ask to be hard to refuse</div>
        <p>Note what this draft does <strong>not</strong> do. It does not abolish emergency measures. It does not add a waiting period to genuine emergencies. It does not change the vote threshold.</p>
        <p>It requires Council to <strong>say why</strong> &mdash; and to vote on the shortcut separately from the substance. A member who opposes it has to explain, in public, why they should not have to give a reason.</p>
      </div>
      <div class="note"><b>MANDATORY:</b> Charter amendment language must be reviewed by an Ohio election-law attorney before circulation. Signature thresholds, the definition of &ldquo;electors,&rdquo; filing deadlines, and ballot-language requirements are technical and unforgiving.</div>
    </div>
  </div>`},

/* 25 */ {part:"PART IV — THE PLAYBOOK", kicker:"Part IV · The Playbook", title:"The 90-day action calendar",
  sub:"A realistic sequence for a small volunteer group starting from zero.", html:`
  <table class="tbl">
    <thead><tr><th style="width:14%">Window</th><th style="width:30%">Do this</th><th style="width:28%">Produces</th><th style="width:28%">People needed</th></tr></thead>
    <tbody>
      <tr><td class="k">Days 1&ndash;14</td><td>Stand up the emergency log. Pull every 2026 ordinance from Legistar into a spreadsheet. Record emergency Y/N, readings suspended Y/N, sponsor, dollar amount, preamble text.</td><td>A baseline dataset nobody can dispute</td><td>2&ndash;3 people, ~4 hrs each</td></tr>
      <tr><td class="k">Days 15&ndash;30</td><td>Score every 2026 emergency preamble against the five-question test. Compute the percentage that state a specific date and harm.</td><td>Your headline number</td><td>2&ndash;3 people</td></tr>
      <tr><td class="k">Days 31&ndash;45</td><td>Publish a short findings brief. Send to Council members, the Clerk, Signal Cleveland, The Land, Cleveland Documenters, and the ACLU of Ohio.</td><td>Press coverage and a paper trail</td><td>1 writer, 1 organizer</td></tr>
      <tr><td class="k">Days 46&ndash;60</td><td>Testify at three consecutive Council meetings using the Tier 2 script. Ask each member in writing for a commitment on preamble specificity.</td><td>On-the-record positions from named members</td><td>3&ndash;6 speakers</td></tr>
      <tr><td class="k">Days 61&ndash;75</td><td>Formally request the three Council rules changes (Slide 23) through a sponsoring member. Publish who agreed to sponsor and who declined.</td><td>A legislative vehicle, or a refusal on record</td><td>1&ndash;2 people</td></tr>
      <tr><td class="k">Days 76&ndash;90</td><td>Launch the monthly sponsor scorecard. Decide, based on Council's response, whether to prepare the charter amendment.</td><td>A standing accountability instrument</td><td>1 person, ongoing</td></tr>
    </tbody>
  </table>
  <div class="card good" style="margin-top:16px">
    <div class="eyebrow">Note what is not on this calendar</div>
    <p>No petition drive. No litigation. Ninety days of disciplined public work costs a handful of volunteers a few hours a week and produces something Council has to answer. Save the expensive tools for the fight where they will matter most &mdash; and let everyone know you have them.</p>
  </div>`},

/* 27 */ {part:"PART IV — THE PLAYBOOK", kicker:"Reference", title:"Myths and straight answers",
  sub:"The five things people get wrong about this issue &mdash; including in documents circulating right now.", html:`
  <div class="grid g2">
    <div class="card warn">
      <div class="eyebrow o">MYTH &mdash; &ldquo;Emergency ordinances can never be referended in Cleveland.&rdquo;</div>
      <p><strong>Wrong, and this is the most important correction in the deck.</strong> That is the rule under ORC § 731.30 for non-charter cities. Cleveland Charter § 64 says the opposite for most measures: <em>&ldquo;Otherwise, emergency measures shall be subject to referendum in like manner as other ordinances.&rdquo;</em> Confirm the scope with counsel &mdash; but do not concede the point.</p>
    </div>
    <div class="card warn">
      <div class="eyebrow o">MYTH &mdash; &ldquo;Council is acting illegally.&rdquo;</div>
      <p>No. The emergency clause is lawful and the votes are real. The problem is not lawlessness; it is a lawful default that has swallowed the rule. Say it accurately or you will be dismissed &mdash; and the accurate version is damning enough.</p>
    </div>
    <div class="card warn">
      <div class="eyebrow o">MYTH &mdash; &ldquo;This is a dictatorship.&rdquo;</div>
      <p>Members are elected, meetings are public, agendas are published, and the charter was adopted by voters. What is true is narrower and more useful: <strong>routine emergency use removes the one mechanism voters have to act between elections.</strong> That sentence survives fact-checking. The other one does not.</p>
    </div>
    <div class="card warn">
      <div class="eyebrow o">MYTH &mdash; &ldquo;You need a Council majority to fix this.&rdquo;</div>
      <p>You need <strong>six members</strong> to withhold a two-thirds emergency vote &mdash; and eight to change Council's rules. Six is an organizing target, not a fantasy. The Flock ordinance cleared the majority bar and missed the emergency bar by one.</p>
    </div>
    <div class="card warn" style="grid-column:1/-1">
      <div class="eyebrow o">MYTH &mdash; &ldquo;Nothing has changed, so nothing will.&rdquo;</div>
      <p>Two things changed in 2026. Cleveland residents ran a live referendum on an emergency-adjacent ordinance, and the Ohio Supreme Court held that boilerplate emergency language will not defeat a petition. Both are recent enough that most Council offices have not yet adjusted to them. <strong>That gap is the opportunity.</strong></p>
    </div>
  </div>`},

/* 28 */ {part:"REFERENCE", kicker:"Reference", title:"Key provisions at a glance",
  sub:"Clip this slide. It is the citation sheet for testimony and press.", html:`
  <table class="tbl">
    <thead><tr><th style="width:22%">Provision</th><th style="width:48%">What it says</th><th style="width:30%">Why you cite it</th></tr></thead>
    <tbody>
      <tr><td class="k">Cleveland Charter § 36<br><span style="font-weight:400;color:var(--paper-2)">Emergency Measures</span></td><td>Emergency measures are those for immediate preservation of public peace, property, health, or safety, <em>or</em> providing for the usual daily operation of a municipal department, with the emergency set forth and defined in a preamble. Two-thirds of elected members required. Franchises and public utility rate regulation may never be emergency measures.</td><td>The source of the shortcut &mdash; and of the preamble requirement you will hold them to.</td></tr>
      <tr><td class="k">Cleveland Charter § 59<br><span style="font-weight:400;color:var(--paper-2)">Referendum</span></td><td>A non-emergency ordinance does not take effect for 30 days. A petition filed with the Clerk of Council within that window requesting repeal or submission to the electors prevents the ordinance from becoming operative.</td><td>The 30-day window and the suspensive effect of filing.</td></tr>
      <tr><td class="k">Cleveland Charter § 64<br><span style="font-weight:400;color:var(--paper-2)">Referendum on Emergency Measures</span></td><td>&ldquo;Otherwise, emergency measures shall be subject to referendum in like manner as other ordinances, except that they shall go into effect at the time indicated in the ordinances.&rdquo; Effective Nov. 4, 2008.</td><td>The strongest provision residents have, and the least known.</td></tr>
      <tr><td class="k">ORC § 731.30</td><td>Emergency measures must be necessary for immediate preservation of public peace, health, or safety; reasons stated in one section; two-thirds vote of all members elected; immediate effect.</td><td>The statewide baseline, and the statute construed in <em>Grube</em>.</td></tr>
      <tr><td class="k">Ohio Const. Art. XVIII § 9</td><td>Charter amendments may be submitted to the electors by a two-thirds vote of the legislative authority, or must be submitted on a petition signed by ten per centum of the electors of the municipality.</td><td>The two routes to a charter amendment.</td></tr>
      <tr><td class="k"><em>State ex rel. McNamara-Smith v. Grube</em><br><span style="font-weight:400;color:var(--paper-2)">2026-Ohio-3035 (Aug. 7, 2026)</span></td><td>Parroting the statutory emergency language is not enough; the measure must state specific reasons; after-the-fact justifications do not count; whether a measure is subject to referendum is a judicial question.</td><td>The case that turns a good-government argument into a legal one.</td></tr>
    </tbody>
  </table>`},

/* 30 */ {closer:true, part:"CLOSING", kicker:"Closing", title:"Closing", html:`

    filter:drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 26px rgba(255,255,255,.55)) drop-shadow(0 0 54px rgba(255,255,255,.26))">
  <h1>An emergency everyone can see coming<br>is <em>not an emergency.</em></h1>
  <div class="csub" style="max-width:70ch">Cleveland's charter already gives residents more power over emergency measures than almost anyone in the city realizes. The work is to use it &mdash; log the ordinances, score the preambles, ask for the six votes, publish the count, and make the shortcut cost something.</div>
